version: "2"

linters:
  default: standard
  enable:
    - errorlint
    - exhaustive
    - gosec
    - unconvert
    - unparam
    - misspell
    - goconst
    - bodyclose
    - revive
    # noctx (require context-aware http/db calls everywhere) is deliberately
    # NOT enabled: this project uses no context.Context anywhere yet, so
    # satisfying it would mean threading ctx through the whole codebase —
    # a real architectural change, not a lint fix, and out of scope for a
    # v1 lint pass.
  settings:
    exhaustive:
      # A switch with an explicit default is exempt from listing every
      # enum value by name — that's the point of exhaustive's "handle it
      # or explicitly ignore it" rule for a case like
      # scte35.parseSpliceCommand's switch on SpliceCommandType: known
      # types get real handling, and default is the deliberate, documented
      # catch-all for every command type this package doesn't decode (see
      # the package doc). Without this, exhaustive would instead demand
      # every future SCTE-35 command type be named explicitly even though
      # the fallback behavior for it is already correct by design.
      default-signifies-exhaustive: true
  exclusions:
    rules:
      # Test files: response-body/Close/Decode error checks on a real
      # fixture server add no real safety (a failure there surfaces as a
      # downstream assertion failure anyway) — checking every one is
      # noise, not rigor. Repeated literal fixture values (e.g.
      # "seg_000.ts") in table-driven test data aren't a maintainability
      # smell either.
      - path: _test\.go
        linters:
          - errcheck
          - goconst
          - gosec
      # fmt.Fprint(f|ln) writes into a bufio.Writer that's Flush()'d and
      # checked at the end (internal/manifest.Write) — bufio.Writer has a
      # sticky first-error that Flush surfaces, so checking every
      # individual call is redundant with that, not a real gap.
      - path: internal/manifest/manifest\.go
        linters:
          - errcheck
      # gosec flags this project's real, intentional SSRF mitigation
      # (internal/playground/live.go's validatePublicHTTPURL) for the
      # exact network calls it's making the safety check with — a false
      # positive on the code that IS the fix, not something it's missing.
      - path: internal/playground/live\.go
        linters:
          - gosec
      # G120 false positive: this multipart form parse is already bounded
      # by http.MaxBytesReader on the request body (see the surrounding
      # handler), which gosec's static check doesn't follow.
      - path: internal/playground/playground\.go
        text: "G120"
      # G204 (subprocess launched with variable arguments) is this
      # project's core, intentional architecture — ADR 0001: FFmpeg via
      # CLI subprocess, not cgo, for v1. exec.Command never invokes a
      # shell, so classic shell-injection doesn't apply; the arguments are
      # built from parsed/validated params, not raw user input.
      - path: internal/transcode/transcode\.go
        text: "G204"
      - path: internal/abrbench/abrbench\.go
        text: "G204"
      # G115 false positive: internal/scte35's bitreader
      # (readBits(n int) (uint64, error)) guarantees its returned value
      # fits within n bits before any narrower conversion, so the
      # narrowing here can never overflow — gosec's check is purely
      # syntactic and can't see that invariant.
      - path: internal/scte35/
        text: "G115"
      - path: internal/mpd/emsg\.go
        text: "G115"
      # G115 on cmd/gentestcue: a small local dev tool (generates a test
      # SCTE-35 cue for testdata) whose flags are typed by whoever is
      # running it, not exposed input — not worth validating for overflow.
      - path: cmd/gentestcue/main\.go
        text: "G115"
      # G703 false positive: dst is filepath.Join(outDir, prefix+segmentURI)
      # where both outDir and every segment URI are generated by this
      # package's own FFmpeg encode step, not derived from arbitrary
      # user-supplied paths — gosec's taint analysis can't see that the
      # "taint" here never actually reaches outside server-controlled
      # values.
      - path: internal/contentprep/contentprep\.go
        text: "G703"
      # G703 false positive: saveUpload's destPath is job.dir (a
      # server-generated job ID) plus sanitizeExt's output, which is
      # validated to contain only ['.', a-z, A-Z, 0-9] right above the
      # call site — the path-separator injection this rule exists to
      # catch is exactly what sanitizeExt rules out.
      - path: internal/playground/playground\.go
        text: "G703"
      # G706 false positive: sanitizeForLog (this file) already strips
      # control characters (the actual log-injection vector) before these
      # values reach log.Printf — gosec doesn't recognize a hand-rolled
      # sanitizer as clearing the taint.
      - path: internal/adfixture/adfixture\.go
        text: "G706"
      # G304 false positive: in all three of these, the path is built from
      # this package's own outDir/sessionDir/manifestName — server
      # configuration and internally-generated names, not attacker-supplied
      # input — so there's no real file-inclusion vector for gosec's taint
      # check to be catching.
      - path: internal/contentprep/contentprep\.go
        text: "G304"
      - path: internal/server/server\.go
        text: "G304"
      - path: internal/transcode/transcode\.go
        text: "G304"
      # playground.go's paths are all job.dir-scoped (server-generated
      # job IDs, not attacker-supplied) or the fixed Config.DemoContentPath
      # — same false-positive shape as the other G304 exclusions above.
      - path: internal/playground/playground\.go
        text: "G304"
      # G304 in cmd/: these paths come straight from CLI flags
      # (-content/-ad/-out/etc) on a local dev tool run by whoever already
      # has a shell and full filesystem access — unlike internal/playground
      # or internal/server, there's no network boundary here for
      # "file inclusion via variable" to actually cross.
      - path: cmd/stitchpoint/
        text: "G304"
      # G108: the pprof endpoint IS the point of this file — it's already
      # gated behind an opt-in -pprof-addr flag (empty/disabled by
      # default) and served on its own separate listener, never merged
      # into any command's public-facing mux. That's the mitigation
      # gosec's own docs recommend for G108, not something missing here.
      - path: internal/httpserve/pprof\.go
        text: "G108"
